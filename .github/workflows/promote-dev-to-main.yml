name: Promote dev to main

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open dev -> main PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          open=$(gh pr list --base main --head dev --state open --json number --jq length)
          if [ "$open" != "0" ]; then exit 0; fi
          ahead=$(gh api "repos/$GH_REPO/compare/main...dev" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then exit 0; fi
          gh pr create --base main --head dev --title "Promote dev to main" --body "Automated promotion of dev to main."
